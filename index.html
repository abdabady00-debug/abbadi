<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050506">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ABBADI</title>
<style>
  :root {
    --bg: #050506;
    --card: #0d0d0f;
    --card-2: #131316;
    --line: #222226;
    --line-2: #33333a;
    --text: #f5f5f6;
    --muted: #8d8d96;
    --dim: #5c5c65;
    --gold: #ffb800;
    --teal: #2dd4bf;
    --gray: #6f6f78;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 15px; min-height: 100vh;
         background:
           radial-gradient(700px 360px at 85% -120px, #ffb80022, transparent 70%),
           radial-gradient(700px 360px at 12% -120px, #2dd4bf1c, transparent 70%), var(--bg);
         background-repeat: no-repeat; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--gold); color: #000; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 24px 70px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 11px; direction: ltr; color: var(--gold); }
  .logo svg { width: 50px; height: 28px; }
  .logo span { font-weight: 800; letter-spacing: .3em; font-size: 16px; }
  .actions { display: flex; gap: 8px; align-items: center; position: relative; }

  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--card-2); border: 1px solid var(--line-2); padding: 8px 15px; border-radius: 10px; transition: .15s; font-size: 14px; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.1); color: #000; }

  .menu { position: absolute; top: 44px; left: 0; background: #0f0f11; border: 1px solid var(--line-2);
          border-radius: 12px; padding: 5px; min-width: 220px; display: none; z-index: 20; box-shadow: 0 20px 60px #000; }
  .menu.open { display: block; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; background: none; border: 0; padding: 9px 12px; border-radius: 8px; font-size: 14px; }
  .menu button:hover { background: var(--gold); color: #000; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }

  .hero { margin-bottom: 12px; }
  .hero h1 { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 700; padding: 5px 15px; border: 1px solid #ffb80055;
             border-radius: 999px; color: var(--gold); background: #ffb80014; }

  .search { position: relative; margin-bottom: 14px; }
  .search input { width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 14px;
                  padding: 14px 46px; font-size: 17px; outline: none; transition: .15s; }
  .search input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px #ffb80020; }
  .search input::placeholder { color: var(--dim); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search > svg { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--gold); }
  .clear { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%;
           border: 0; background: #1c1c20; color: var(--muted); display: none; place-items: center; padding: 0; }
  .clear svg { width: 13px; height: 13px; }
  .clear:hover { background: var(--gold); color: #000; }
  .kbd { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--dim); border: 1px solid var(--line-2);
         border-radius: 5px; padding: 0 7px; font-family: Consolas, monospace; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; text-align: right; transition: .15s; }
  .stat .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--s) 15%, transparent); color: var(--s); flex: none; }
  .stat b { display: block; font-size: 18px; font-weight: 700; line-height: 1.1; }
  .stat small { color: var(--muted); font-size: 12px; }
  .stat:hover { border-color: var(--s); }
  .stat.on { background: color-mix(in srgb, var(--s) 14%, var(--card)); border-color: var(--s); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips .lbl { color: var(--dim); font-size: 12px; margin-left: 2px; }
  .chip { background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 11px; font-size: 12px; color: var(--muted); direction: ltr; transition: .15s; }
  .chip:hover { color: var(--gold); border-color: var(--gold); }
  .chip.on { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }
  .sort { background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 5px 9px; font-size: 12px; color: var(--muted); outline: none; }
  .sort:focus { border-color: var(--gold); }
  .sort option { background: #111; }

  .count { color: var(--dim); font-size: 12px; margin: 0 2px 10px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .item { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
          background: linear-gradient(180deg, #121215, #0a0a0c); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 14px; transition: .15s; }
  .item:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .thumb { width: 62px; height: 62px; border-radius: 12px; background: #17171b; border: 1px solid var(--line); overflow: hidden; flex: none;
           display: grid; place-items: center; color: var(--dim); padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.has { cursor: zoom-in; }
  .thumb.has:hover { border-color: var(--gold); }
  .thumb svg { width: 24px; height: 24px; stroke-width: 1.5; }
  .info { flex: 1; min-width: 0; }
  .info h3 { margin: 1px 0 7px; font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { background: #16161a; border: 1px solid var(--line); border-radius: 7px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
  .tag b { color: var(--text); font-weight: 600; font-family: Consolas, "Courier New", monospace; direction: ltr; display: inline-block; }
  .tag.serial b { color: var(--gold); }
  mark { background: var(--gold); color: #000; border-radius: 3px; padding: 0 2px; }
  .acts { display: flex; flex-direction: column; gap: 2px; opacity: 0; transition: .15s; }
  .item:hover .acts, .item:focus-within .acts { opacity: 1; }
  .ib { width: 26px; height: 26px; display: grid; place-items: center; background: none; border: 0; border-radius: 7px; color: var(--dim); padding: 0; }
  .ib:hover { background: #1d1d22; color: var(--gold); }
  .ib.del:hover { color: #ff7a7a; }

  .bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 11px; border-top: 1px solid var(--line); }
  .badge { font-size: 11px; padding: 2px 10px; border-radius: 999px; color: var(--st); background: color-mix(in srgb, var(--st) 14%, transparent); font-weight: 700; border: 1px solid color-mix(in srgb, var(--st) 40%, transparent); }
  .ok { --st: var(--teal); } .low { --st: var(--gold); } .out { --st: var(--gray); }
  .qty { display: flex; align-items: center; gap: 4px; background: #0a0a0c; border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .qty .n { min-width: 40px; text-align: center; font-size: 17px; font-weight: 700; color: var(--st); }
  .out .qty .n { text-decoration: line-through; }
  .item.out h3 { color: var(--muted); }
  .round { width: 28px; height: 28px; border-radius: 8px; background: var(--card-2); border: 0; display: grid; place-items: center; padding: 0; transition: .15s; }
  .round:hover { background: var(--gold); color: #000; }

  .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
  .panel { background: linear-gradient(180deg, #111114, #09090b); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .panel h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 11px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .panel h2 svg { color: var(--gold); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: #0a0a0c; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 20px; font-weight: 700; }
  .kpi small { color: var(--muted); font-size: 11.5px; }
  .kpi.wide { grid-column: 1 / -1; }
  .kpi.wide b { color: var(--teal); }
  .mini { display: flex; flex-direction: column; gap: 6px; }
  .mrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; background: #0a0a0c; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; transition: .15s; }
  .mrow:hover { border-color: var(--gold); }
  .mrow .mt { width: 30px; height: 30px; border-radius: 8px; background: #17171b; overflow: hidden; display: grid; place-items: center; color: var(--dim); flex: none; }
  .mrow .mt img { width: 100%; height: 100%; object-fit: cover; }
  .mrow .mt svg { width: 16px; height: 16px; }
  .mrow .mi { flex: 1; min-width: 0; }
  .mrow .mi div { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .mi small { color: var(--dim); font-size: 11px; font-family: Consolas, monospace; direction: ltr; display: block; text-align: right; }
  .mrow .mq { font-size: 14px; font-weight: 700; color: var(--st); }
  .good { color: var(--teal); font-size: 13px; padding: 8px 4px; display: flex; align-items: center; gap: 8px; }
  .hint { color: var(--dim); font-size: 12.5px; line-height: 1.7; margin: 0; }
  .hint b { color: var(--muted); font-weight: 600; }

  .share { width: 100%; margin-top: 12px; display: flex; gap: 8px; justify-content: center; align-items: center; background: var(--teal); color: #00110f;
           border: 0; border-radius: 11px; padding: 10px; font-weight: 700; font-size: 13.5px; transition: .15s; }
  .share:hover { filter: brightness(1.1); }
  .plain { width: 100%; margin-top: 6px; background: none; border: 1px solid var(--line-2); border-radius: 10px; padding: 7px; color: var(--muted); font-size: 12.5px; }
  .plain:hover { border-color: var(--gold); color: var(--gold); }

  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .cat { background: var(--card); border: 1px solid var(--line-2); border-radius: 11px; padding: 7px 14px; font-size: 13.5px; color: var(--muted);
         display: inline-flex; gap: 8px; align-items: center; transition: .15s; }
  .cat em { font-style: normal; font-size: 11.5px; background: #1a1a1e; border-radius: 999px; padding: 0 8px; color: var(--muted); }
  .cat:hover { border-color: var(--gold); color: var(--gold); }
  .cat.on { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 700; }
  .cat.on em { background: #00000026; color: #000; }
  .cat.add { border-style: dashed; background: transparent; }
  .sel { width: 100%; background: #000; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 13px; outline: none; }
  .sel:focus { border-color: var(--gold); }
  .sel option { background: #111; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 54px 10px; border: 1px dashed var(--line-2); border-radius: var(--radius); }
  .empty h2 { color: var(--gold); font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  .empty p { margin: 0; font-size: 13.5px; }

  .banner { background: var(--card); border: 1px solid #ffb80055; color: var(--muted); border-radius: 11px; padding: 9px 13px; margin-bottom: 16px; font-size: 13px; display: none; }

  .overlay { position: fixed; inset: 0; background: #000d; display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; backdrop-filter: blur(4px); }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line-2); border-radius: 20px; padding: 24px; width: 100%; max-width: 480px; max-height: 94vh; overflow: auto; border-top: 3px solid var(--gold); }
  .modal h2 { margin: 0 0 18px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
  .field input { width: 100%; background: #000; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 13px; outline: none; }
  .field input:focus { border-color: var(--gold); }
  .field input.ltr { direction: ltr; text-align: left; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foot { display: flex; gap: 8px; margin-top: 18px; }

  .photo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .pbox { width: 84px; height: 84px; border-radius: 14px; border: 1px dashed var(--line-2); background: #0a0a0c; display: grid; place-items: center; overflow: hidden; cursor: pointer; color: var(--dim); flex: none; padding: 0; transition: .15s; }
  .pbox:hover { border-color: var(--gold); color: var(--gold); }
  .pbox img { width: 100%; height: 100%; object-fit: cover; }
  .pbox svg { width: 26px; height: 26px; stroke-width: 1.5; }
  .ptxt { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .ptxt .link { background: none; border: 0; padding: 0; color: var(--gold); font-size: 12.5px; margin-left: 10px; }
  .ptxt .link.rm { color: #ff7a7a; }

  .lightbox { position: fixed; inset: 0; background: #000e; display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: min(92vw, 720px); max-height: 86vh; border-radius: 16px; border: 1px solid var(--line-2); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 9px 20px;
           border-radius: 999px; font-weight: 700; font-size: 13px; display: none; z-index: 60; }

  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; order: 2; }
  }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .acts { opacity: 1; }
    .kbd { display: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>

    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4V8z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4z"/><path d="M12 10v4.5M12 17.5v.1"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"/></symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></symbol>

</svg>

<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 60 34" fill="none" aria-hidden="true">
        <rect x="2" y="5" width="56" height="24" rx="12" stroke="currentColor" stroke-width="3.5" stroke-dasharray="2.6 2.2"/>
        <rect x="6.5" y="9.5" width="47" height="15" rx="7.5" stroke="currentColor" stroke-width="2"/>
        <circle cx="15" cy="17" r="4.2" stroke="currentColor" stroke-width="2"/><circle cx="45" cy="17" r="4.2" stroke="currentColor" stroke-width="2"/>
        <circle cx="15" cy="17" r="1.4" fill="currentColor"/><circle cx="45" cy="17" r="1.4" fill="currentColor"/>
        <circle cx="25" cy="21.5" r="1.6" fill="currentColor"/><circle cx="30" cy="21.5" r="1.6" fill="currentColor"/><circle cx="35" cy="21.5" r="1.6" fill="currentColor"/>
      </svg>
      <span>ABBADI</span>
    </div>
    <div class="actions">
      <button class="btn primary" id="addBtn"><svg class="i"><use href="#i-plus"/></svg>قطعة جديدة</button>
      <button class="btn" id="moreBtn">المزيد</button>
      <div class="menu" id="menu">
        <button id="backupBtn"><svg class="i"><use href="#i-down"/></svg>نسخة احتياطية (ملف)</button>
        <button id="restoreBtn"><svg class="i"><use href="#i-up"/></svg>استعادة من نسخة احتياطية</button>
        <button id="exportBtn"><svg class="i"><use href="#i-sheet"/></svg>تصدير إلى Excel</button>
        <button id="importBtn"><svg class="i"><use href="#i-sheet"/></svg>استيراد من Excel / CSV</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner">مرّ أكثر من أسبوع على آخر نسخة احتياطية. افتح "المزيد" ثم "نسخة احتياطية".</div>

  <div class="layout">
    <main>
      <div class="hero"><h1><svg class="i"><use href="#i-search"/></svg>دوّر على القطعة</h1></div>

      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="سيريال، قياس، أو اسم...">
        <span class="kbd" id="kbd">/</span>
        <button class="clear" id="clear" title="مسح"><svg class="i"><use href="#i-x"/></svg></button>
      </div>

      <div class="cats" id="cats"></div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <select class="sort" id="sort" title="الترتيب">
          <option value="name">ترتيب: الاسم</option>
          <option value="qtyAsc">ترتيب: الأقل كمية</option>
          <option value="qtyDesc">ترتيب: الأكثر كمية</option>
          <option value="newest">ترتيب: الأحدث إضافة</option>
        </select>
      </div>

      <div class="count" id="count"></div>
      <div class="list" id="list"></div>
    </main>

    <aside class="side" id="side"></aside>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mTitle">قطعة جديدة</h2>
    <div class="photo">
      <button class="pbox" id="pbox" type="button" title="اختر صورة"></button>
      <div class="ptxt">
        صورة القطعة (اختياري)<br>
        <button class="link" id="pPick" type="button">اختيار صورة</button><button class="link rm" id="pRemove" type="button" style="display:none">إزالة</button><br>
        تقدر كمان تلصق صورة بـ Ctrl+V
      </div>
    </div>
    <div class="field"><label>التصنيف</label><select id="fCat" class="sel"></select></div>
    <div class="field"><label>الاسم / النوع</label><input id="fName"></div>
    <div class="row">
      <div class="field"><label>السيريال نمبر</label><input id="fSerial" class="ltr"></div>
      <div class="field"><label>القياس</label><input id="fSize" class="ltr"></div>
    </div>
    <div class="row">
      <div class="field"><label>الكمية</label><input id="fQty" type="number" min="0" value="1" class="ltr"></div>
      <div class="field"><label>السعر (اختياري)</label><input id="fPrice" class="ltr" inputmode="decimal"></div>
    </div>
    <div class="field"><label>مكان القطعة / الرف (اختياري)</label><input id="fLoc"></div>
    <div class="foot">
      <button class="btn primary" id="saveBtn">حفظ</button>
      <button class="btn" id="cancelBtn">إلغاء</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lbImg" alt=""></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = "abbadi.items.v1", KEY_BK = "abbadi.lastBackup", KEY_SORT = "abbadi.sort", KEY_CATS = "abbadi.cats";
  var LOW = 2;
  var DEFAULT_CATS = ["رنجات", "مسننات", "مرايا", "طرمبات", "موتورات"];
  var items = [], cats = [], catFilter = "", sizeFilter = "", statusFilter = "", editingId = null, pendingImg = "";
  var $ = function (id) { return document.getElementById(id); };
  function ico(n, cls) { return '<svg class="i' + (cls ? " " + cls : "") + '"><use href="#i-' + n + '"/></svg>'; }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function load() {
    try { items = JSON.parse(lsGet(KEY)) || []; } catch (e) { items = []; }
    try { cats = JSON.parse(lsGet(KEY_CATS)); } catch (e) { cats = null; }
    if (!Array.isArray(cats) || !cats.length) cats = DEFAULT_CATS.slice();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); return true; } catch (e) { return false; }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // يحوّل الأرقام العربية للإنجليزية ويوحّد الحروف ليصير البحث أسهل (نفس الطول بالضبط)
  function normc(s) {
    return String(s == null ? "" : s)
      .replace(/[٠-٩]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0x660 + 48); })
      .replace(/[۰-۹]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0x6f0 + 48); })
      .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
      .toLowerCase();
  }
  function norm(s) { return normc(s).trim(); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // يظلّل الكلمات المطابقة داخل النص
  function hl(text, tokens) {
    text = String(text == null ? "" : text);
    if (!tokens.length || !text) return esc(text);
    var n = normc(text);
    if (n.length !== text.length) return esc(text);
    var mark = new Array(text.length + 1).join("0").split("");
    tokens.forEach(function (t) {
      if (!t) return;
      var i = n.indexOf(t);
      while (i >= 0) { for (var k = i; k < i + t.length; k++) mark[k] = "1"; i = n.indexOf(t, i + t.length); }
    });
    var out = "", on = false;
    for (var j = 0; j < text.length; j++) {
      var m = mark[j] === "1";
      if (m && !on) { out += "<mark>"; on = true; }
      if (!m && on) { out += "</mark>"; on = false; }
      out += esc(text[j]);
    }
    return on ? out + "</mark>" : out;
  }
  function status(it) { var n = Number(it.qty) || 0; return n <= 0 ? "out" : n <= LOW ? "low" : "ok"; }
  function num(v) { var x = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isNaN(x) ? 0 : x; }

  function catOk(it) {
    if (!catFilter) return true;
    if (catFilter === "__none") return !it.cat;
    return it.cat === catFilter;
  }
  // أي تصنيف موجود بالقطع (مثلاً من نسخة احتياطية) وما هو بالقائمة ينضاف تلقائياً
  function syncCats() {
    var changed = false;
    items.forEach(function (it) { if (it.cat && cats.indexOf(it.cat) < 0) { cats.push(it.cat); changed = true; } });
    if (changed) lsSet(KEY_CATS, JSON.stringify(cats));
  }
  function fillCat(val) {
    $("fCat").innerHTML = '<option value="">بدون تصنيف</option>' + cats.map(function (c) {
      return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
    }).join("");
    $("fCat").value = val || "";
  }
  function matches(it, tokens) {
    var hay = norm(it.serial + " " + it.name + " " + it.size + " " + (it.loc || "") + " " + (it.cat || ""));
    for (var i = 0; i < tokens.length; i++) if (hay.indexOf(tokens[i]) < 0) return false;
    return true;
  }

  function thumbHtml(it, cls) {
    return it.img ? '<img src="' + it.img + '" alt="">' : ico("box");
  }

  function renderSide() {
    var pieces = items.reduce(function (n, it) { return n + (Number(it.qty) || 0); }, 0);
    var value = items.reduce(function (n, it) { return n + num(it.price) * (Number(it.qty) || 0); }, 0);
    var kp = '<div class="kpis"><div class="kpi"><b>' + items.length + '</b><small>صنف مسجّل</small></div>' +
             '<div class="kpi"><b>' + pieces + '</b><small>قطعة بالمحل</small></div>' +
             (value > 0 ? '<div class="kpi wide"><b>' + Math.round(value).toLocaleString("en") + '</b><small>قيمة البضاعة حسب الأسعار المدخلة</small></div>' : "") + "</div>";

    $("side").innerHTML =
      '<div class="panel"><h2>' + ico("chart") + "ملخص الجرد</h2>" + kp +
      '<button class="share" id="shareBtn">' + ico("send") + "إرسال الجرد PDF عبر واتساب</button>" +
      '<button class="plain" id="pdfBtn">حفظ PDF فقط</button></div>';
  }

  function render() {
    var q = norm($("q").value);
    var tokens = q ? q.split(/\s+/) : [];
    $("clear").style.display = $("q").value ? "grid" : "none";
    $("kbd").style.display = $("q").value ? "none" : "";
    syncCats();
    var base = items.filter(catOk);

    var perCat = {};
    items.forEach(function (it) { perCat[it.cat || ""] = (perCat[it.cat || ""] || 0) + 1; });
    var tabs = '<button class="cat' + (catFilter === "" ? " on" : "") + '" data-cat="">الكل <em>' + items.length + "</em></button>" +
      cats.map(function (n) {
        return '<button class="cat' + (catFilter === n ? " on" : "") + '" data-cat="' + esc(n) + '">' + esc(n) + " <em>" + (perCat[n] || 0) + "</em></button>";
      }).join("") +
      (perCat[""] && perCat[""] < items.length ? '<button class="cat' + (catFilter === "__none" ? " on" : "") + '" data-cat="__none">بدون تصنيف <em>' + perCat[""] + "</em></button>" : "") +
      '<button class="cat add" data-cat="__add">+ تصنيف</button>';
    $("cats").innerHTML = tabs;

    // المربعات الإحصائية (تعمل كفلتر أيضاً)
    var c = { "": base.length, ok: 0, low: 0, out: 0 };
    base.forEach(function (it) { c[status(it)]++; });
    var defs = [["", "كل الأصناف", "#e8e8ea", "layers"], ["ok", "متوفر", "var(--teal)", "check"], ["low", "قليل", "var(--gold)", "alert"], ["out", "نفد", "#9a9aa3", "x"]];
    $("stats").innerHTML = defs.map(function (d) {
      return '<button class="stat' + (statusFilter === d[0] ? " on" : "") + '" style="--s:' + d[2] + '" data-st="' + d[0] + '"><span class="ic">' + ico(d[3]) + '</span><span><b>' + c[d[0]] + "</b><small>" + d[1] + "</small></span></button>";
    }).join("");

    // أزرار القياسات
    var sizes = [], seen = {};
    base.forEach(function (it) {
      var s = (it.size || "").trim();
      if (s && !seen[norm(s)]) { seen[norm(s)] = 1; sizes.push(s); }
    });
    sizes.sort(function (a, b) { return a.localeCompare(b, "en", { numeric: true }); });
    if (sizeFilter && !seen[norm(sizeFilter)]) sizeFilter = "";
    $("chips").innerHTML = sizes.length > 1 ? '<span class="lbl">القياس:</span>' + sizes.map(function (s) {
      return '<button class="chip' + (norm(s) === norm(sizeFilter) ? " on" : "") + '" data-size="' + esc(s) + '">' + esc(s) + "</button>";
    }).join("") : "";

    var res = items.filter(function (it) {
      return matches(it, tokens) && catOk(it) && (!sizeFilter || norm(it.size) === norm(sizeFilter)) && (!statusFilter || status(it) === statusFilter);
    });
    var mode = $("sort").value;
    res.sort(function (a, b) {
      var qa = Number(a.qty) || 0, qb = Number(b.qty) || 0;
      if (mode === "qtyAsc") return qa - qb;
      if (mode === "qtyDesc") return qb - qa;
      if (mode === "newest") return items.indexOf(b) - items.indexOf(a);
      return (a.name || "").localeCompare(b.name || "", "ar") || (a.serial || "").localeCompare(b.serial || "");
    });

    var total = res.reduce(function (n, it) { return n + (Number(it.qty) || 0); }, 0);
    $("count").textContent = items.length ? res.length + " نتيجة · مجموع القطع: " + total : "";

    renderSide();

    if (!items.length) {
      $("list").innerHTML = '<div class="empty"><h2>الجرد فاضي</h2><p>اضغط "قطعة جديدة" لتضيف أول قطعة، أو استورد ملف Excel من "المزيد".</p></div>';
      return;
    }
    if (!res.length) {
      $("list").innerHTML = '<div class="empty"><h2>ما لقيت شي</h2><p>جرّب كلمة أو رقم ثاني.</p></div>';
      return;
    }
    var labels = { ok: "متوفر", low: "قليل", out: "نفد" };
    $("list").innerHTML = res.map(function (it) {
      var st = status(it), n = Number(it.qty) || 0;
      var extra = (it.cat ? '<span class="tag">' + esc(it.cat) + "</span>" : "") + (it.loc ? '<span class="tag">الموقع <b style="font-family:inherit;direction:rtl">' + hl(it.loc, tokens) + "</b></span>" : "") +
                  (it.price ? '<span class="tag">السعر <b>' + esc(it.price) + "</b></span>" : "");
      return '<div class="item ' + st + '" data-id="' + it.id + '"><div class="top">' +
        '<button class="thumb' + (it.img ? " has" : "") + '"' + (it.img ? ' data-act="zoom"' : " tabindex=\"-1\"") + ">" + thumbHtml(it) + "</button>" +
        '<div class="info"><h3>' + hl(it.name || "بدون اسم", tokens) + "</h3>" +
        '<div class="tags"><span class="tag serial">سيريال <b>' + hl(it.serial || "-", tokens) + '</b></span><span class="tag">القياس <b>' + hl(it.size || "-", tokens) + "</b></span>" + extra + "</div></div>" +
        '<div class="acts"><button class="ib" data-act="edit" title="تعديل">' + ico("edit") + '</button><button class="ib del" data-act="del" title="حذف">' + ico("trash") + "</button></div></div>" +
        '<div class="bottom"><span class="badge">' + labels[st] + "</span>" +
        '<div class="qty"><button class="round" data-act="minus" title="نقص واحدة">' + ico("minus") + '</button><span class="n">' + n + '</span><button class="round" data-act="plus" title="زيادة واحدة">' + ico("plus") + "</button></div></div></div>";
    }).join("");
  }

  function byId(id) { return items.filter(function (i) { return i.id === id; })[0]; }
  function persist() { if (!save()) toast("المساحة امتلأت، احذف بعض الصور أو خذ نسخة احتياطية"); }

  $("list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var it = byId(btn.closest(".item").getAttribute("data-id"));
    if (!it) return;
    var act = btn.getAttribute("data-act");
    if (act === "plus") { it.qty = (Number(it.qty) || 0) + 1; persist(); render(); }
    else if (act === "minus") { it.qty = Math.max(0, (Number(it.qty) || 0) - 1); persist(); render(); }
    else if (act === "edit") openModal(it);
    else if (act === "zoom") { $("lbImg").src = it.img; $("lightbox").classList.add("open"); }
    else if (act === "del" && confirm("حذف \"" + (it.name || it.serial) + "\" نهائياً؟")) {
      items = items.filter(function (x) { return x !== it; }); persist(); render(); toast("انحذفت");
    }
  });
  $("lightbox").onclick = function () { this.classList.remove("open"); };

  // ضغطة على قطعة بالقائمة الجانبية تعرضها بالبحث
  $("side").addEventListener("click", function (e) {
    var b = e.target.closest("[data-pick]");
    if (!b) return;
    var it = byId(b.getAttribute("data-pick"));
    if (!it) return;
    $("q").value = it.serial || it.name; statusFilter = ""; sizeFilter = ""; render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("stats").addEventListener("click", function (e) {
    var b = e.target.closest(".stat");
    if (!b) return;
    var st = b.getAttribute("data-st");
    statusFilter = statusFilter === st ? "" : st;
    render();
  });

  $("cats").addEventListener("click", function (e) {
    var b = e.target.closest(".cat");
    if (!b) return;
    var v = b.getAttribute("data-cat");
    if (v === "__add") {
      var name = (prompt("اسم التصنيف الجديد:") || "").trim();
      if (!name) return;
      if (cats.indexOf(name) < 0) { cats.push(name); lsSet(KEY_CATS, JSON.stringify(cats)); }
      catFilter = name; sizeFilter = ""; render(); return;
    }
    catFilter = v; sizeFilter = ""; render();
  });

  $("chips").addEventListener("click", function (e) {
    var c = e.target.closest(".chip");
    if (!c) return;
    var s = c.getAttribute("data-size");
    sizeFilter = norm(s) === norm(sizeFilter) ? "" : s;
    render();
  });

  $("q").addEventListener("input", render);
  $("clear").onclick = function () { $("q").value = ""; render(); $("q").focus(); };
  $("sort").onchange = function () { lsSet(KEY_SORT, this.value); render(); };

  // الصور: تتصغّر وتنضغط قبل الحفظ عشان ما تثقّل البرنامج
  function readImage(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var m = 480, k = Math.min(1, m / Math.max(im.width, im.height));
        var cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
        var cx = cv.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL("image/jpeg", 0.72));
      };
      im.onerror = function () { toast("هذي الصورة غير مدعومة"); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function showPhoto() {
    $("pbox").innerHTML = pendingImg ? '<img src="' + pendingImg + '" alt="">' : ico("cam");
    $("pRemove").style.display = pendingImg ? "" : "none";
    $("pPick").textContent = pendingImg ? "تغيير الصورة" : "اختيار صورة";
  }
  $("pbox").onclick = $("pPick").onclick = function () { $("fileImg").click(); };
  $("pRemove").onclick = function () { pendingImg = ""; showPhoto(); };
  $("fileImg").onchange = function () {
    var f = this.files[0]; this.value = "";
    if (f) readImage(f, function (d) { pendingImg = d; showPhoto(); });
  };
  document.addEventListener("paste", function (e) {
    if (!$("overlay").classList.contains("open")) return;
    var list = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].type.indexOf("image") === 0) {
        readImage(list[i].getAsFile(), function (d) { pendingImg = d; showPhoto(); });
        e.preventDefault(); return;
      }
    }
  });

  // نافذة الإضافة والتعديل
  function openModal(it) {
    editingId = it ? it.id : null;
    pendingImg = it ? (it.img || "") : "";
    $("mTitle").textContent = it ? "تعديل القطعة" : "قطعة جديدة";
    $("fName").value = it ? it.name : "";
    $("fSerial").value = it ? it.serial : "";
    $("fSize").value = it ? it.size : "";
    $("fQty").value = it ? it.qty : 1;
    $("fPrice").value = it ? (it.price || "") : "";
    $("fLoc").value = it ? (it.loc || "") : "";
    fillCat(it ? it.cat : (catFilter && catFilter !== "__none" ? catFilter : ""));
    showPhoto();
    $("overlay").classList.add("open");
    setTimeout(function () { $("fName").focus(); }, 30);
  }
  function closeModal() { $("overlay").classList.remove("open"); }
  function saveModal() {
    var rec = {
      name: $("fName").value.trim(), serial: $("fSerial").value.trim(), size: $("fSize").value.trim(),
      qty: Math.max(0, parseInt($("fQty").value, 10) || 0), price: $("fPrice").value.trim(), loc: $("fLoc").value.trim(), cat: $("fCat").value, img: pendingImg
    };
    if (!rec.name && !rec.serial) { toast("اكتب الاسم أو السيريال"); return; }
    if (rec.serial && items.some(function (x) { return x.id !== editingId && norm(x.serial) === norm(rec.serial); })) {
      if (!confirm("هذا السيريال موجود من قبل. تضيفه كمان مرة؟")) return;
    }
    var before = JSON.stringify(items);
    if (editingId) { var it = byId(editingId); for (var k in rec) it[k] = rec[k]; }
    else { rec.id = uid(); items.push(rec); }
    if (!save()) {
      items = JSON.parse(before);
      toast("المساحة امتلأت. احذف بعض الصور أو خذ نسخة احتياطية");
      return;
    }
    closeModal(); render(); toast("انحفظت");
  }
  $("addBtn").onclick = function () { openModal(null); };
  $("saveBtn").onclick = saveModal;
  $("cancelBtn").onclick = closeModal;
  $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeModal(); });
  $("overlay").addEventListener("keydown", function (e) {
    if (e.key === "Enter") saveModal();
    if (e.key === "Escape") closeModal();
  });

  // اختصارات: "/" للبحث، Esc لمسح البحث
  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement || {}).tagName;
    if (e.key === "Escape") $("lightbox").classList.remove("open");
    if (e.key === "/" && tag !== "INPUT" && !$("overlay").classList.contains("open")) { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; render(); }
  });

  // قائمة المزيد
  $("moreBtn").onclick = function (e) { e.stopPropagation(); $("menu").classList.toggle("open"); };
  document.addEventListener("click", function () { $("menu").classList.remove("open"); });

  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function stamp() { return new Date().toISOString().slice(0, 10); }

  $("backupBtn").onclick = function () {
    download("ABBADI-backup-" + stamp() + ".json", JSON.stringify(items), "application/json");
    lsSet(KEY_BK, String(Date.now()));
    checkBackup(); toast("تم تنزيل النسخة الاحتياطية (فيها الصور)");
  };
  $("restoreBtn").onclick = function () { $("fileJson").click(); };
  $("fileJson").onchange = function () {
    var f = this.files[0]; this.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!Array.isArray(data)) throw 0;
        if (!confirm("راح يستبدل الجرد الحالي بـ " + data.length + " صنف من النسخة. متأكد؟")) return;
        var before = items;
        items = data.map(function (x) {
          return { id: x.id || uid(), name: x.name || "", serial: x.serial || "", size: x.size || "", qty: Number(x.qty) || 0, price: x.price || "", loc: x.loc || "", cat: x.cat || "", img: x.img || "" };
        });
        if (!save()) { items = before; toast("النسخة كبيرة ومش راح تنحفظ على هذا المتصفح"); return; }
        render(); toast("تمت الاستعادة");
      } catch (e) { alert("هذا الملف مش نسخة احتياطية صحيحة."); }
    };
    r.readAsText(f);
  };

  function csvCell(v) { v = String(v == null ? "" : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  $("exportBtn").onclick = function () {
    var rows = [["الاسم", "السيريال", "القياس", "الكمية", "الموقع", "السعر", "التصنيف"]].concat(items.map(function (i) { return [i.name, i.serial, i.size, i.qty, i.loc || "", i.price || "", i.cat || ""]; }));
    var csv = "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    download("ABBADI-" + stamp() + ".csv", csv, "text/csv;charset=utf-8");
    toast("تم تصدير الملف، افتحه بـ Excel (بدون الصور)");
  };

  function parseCsv(text) {
    text = text.replace(/^﻿/, "");
    var first = text.split(/\r?\n/)[0] || "";
    var sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : (first.indexOf("\t") >= 0 ? "\t" : ",");
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === sep) { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = ""; rows.push(row); row = [];
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
  }
  $("importBtn").onclick = function () {
    alert("ملف الـ Excel لازم يكون محفوظ كـ CSV، وأعمدته بالترتيب:\nالاسم، السيريال، القياس، الكمية، (الموقع)، (السعر)، (التصنيف)\n\nالأسهل: صدّر ملف من البرنامج أولاً وشوف الشكل.");
    $("fileCsv").click();
  };
  $("fileCsv").onchange = function () {
    var f = this.files[0]; this.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var rows = parseCsv(r.result);
      if (rows.length && isNaN(parseInt(rows[0][3], 10))) rows.shift(); // سطر العناوين
      var added = rows.map(function (c) {
        return { id: uid(), name: (c[0] || "").trim(), serial: (c[1] || "").trim(), size: (c[2] || "").trim(),
                 qty: Math.max(0, parseInt(c[3], 10) || 0), loc: (c[4] || "").trim(), price: (c[5] || "").trim(), cat: (c[6] || "").trim(), img: "" };
      }).filter(function (x) { return x.name || x.serial; });
      if (!added.length) { alert("ما لقيت بيانات في الملف."); return; }
      if (!confirm("راح يضيف " + added.length + " صنف على الجرد الحالي. متابعة؟")) return;
      items = items.concat(added); persist(); render(); toast("تمت إضافة " + added.length + " صنف");
    };
    r.readAsText(f);
  };

  function checkBackup() {
    var last = Number(lsGet(KEY_BK)) || 0;
    var old = !last || Date.now() - last > 7 * 864e5;
    $("banner").style.display = items.length && old ? "block" : "none";
  }

  var tt;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(tt); tt = setTimeout(function () { t.style.display = "none"; }, 2600);
  }


  // ---------- PDF ----------
  function loadImg(src) {
    return new Promise(function (res) {
      if (!src) return res(null);
      var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = src;
    });
  }
  function fit(ctx, s, maxW) {
    s = String(s == null ? "" : s);
    if (ctx.measureText(s).width <= maxW) return s;
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    return s + "…";
  }
  function buildPages() {
    var list = items.slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "ar") || (a.serial || "").localeCompare(b.serial || ""); });
    return Promise.all(list.map(function (it) { return loadImg(it.img); })).then(function (imgs) {
      var W = 1240, H = 1754, M = 60, ROW = 148, PER = 9, TOP = 250;
      var cols = [["img", "الصورة", 130], ["name", "الاسم", 330], ["serial", "السيريال", 230], ["size", "القياس", 130], ["qty", "الكمية", 100], ["loc", "الموقع", 120], ["price", "السعر", 80]];
      var x = W - M;
      cols.forEach(function (c) { c.r = x; c.l = x - c[2]; c.m = x - c[2] / 2; x -= c[2]; });
      var pieces = items.reduce(function (n, it) { return n + (Number(it.qty) || 0); }, 0);
      var npages = Math.max(1, Math.ceil(list.length / PER));
      var colors = { ok: "#0e9488", low: "#c98a00", out: "#c0392b" };
      var pages = [];
      for (var p = 0; p < npages; p++) {
        var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        var c = cv.getContext("2d");
        c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
        c.fillStyle = "#ffb800"; c.fillRect(0, 0, W, 14);
        c.textBaseline = "middle";
        c.direction = "ltr"; c.textAlign = "left"; c.fillStyle = "#111"; c.font = "bold 54px 'Segoe UI', Arial";
        c.letterSpacing = "10px"; c.fillText("ABBADI", M, 90); c.letterSpacing = "0px";
        c.direction = "rtl"; c.textAlign = "right"; c.font = "bold 40px 'Segoe UI', Arial"; c.fillText("جرد البضاعة", W - M, 78);
        c.fillStyle = "#777"; c.font = "24px 'Segoe UI', Arial";
        c.fillText(stamp() + "  ·  " + items.length + " صنف  ·  " + pieces + " قطعة", W - M, 124);
        c.fillStyle = "#e4e4e8"; c.fillRect(M, 160, W - 2 * M, 2);
        c.fillStyle = "#f3f3f5"; c.fillRect(M, 186, W - 2 * M, 50);
        c.fillStyle = "#666"; c.font = "bold 21px 'Segoe UI', Arial"; c.textAlign = "center";
        cols.forEach(function (k) { c.fillText(k[1], k.m, 212); });
        for (var r = 0; r < PER; r++) {
          var idx = p * PER + r; if (idx >= list.length) break;
          var it = list[idx], im = imgs[idx], y = TOP + r * ROW, cy = y + ROW / 2, st = status(it);
          c.fillStyle = "#e9e9ec"; c.fillRect(M, y + ROW - 1, W - 2 * M, 1);
          var ph = cols[0], bs = 108, bx = ph.m - bs / 2, by = cy - bs / 2;
          c.save(); c.beginPath(); c.roundRect(bx, by, bs, bs, 14); c.clip();
          if (im) {
            var sc = Math.max(bs / im.width, bs / im.height), dw = im.width * sc, dh = im.height * sc;
            c.drawImage(im, bx + (bs - dw) / 2, by + (bs - dh) / 2, dw, dh);
          } else { c.fillStyle = "#f0f0f3"; c.fillRect(bx, by, bs, bs); }
          c.restore();
          c.fillStyle = "#111"; c.textAlign = "right"; c.direction = "rtl"; c.font = "bold 26px 'Segoe UI', Arial";
          c.fillText(fit(c, it.name || "بدون اسم", cols[1][2] - 24), cols[1].r - 12, cy - (it.cat ? 13 : 0));
          if (it.cat) { c.fillStyle = "#999"; c.font = "18px 'Segoe UI', Arial"; c.fillText(fit(c, it.cat, cols[1][2] - 24), cols[1].r - 12, cy + 19); }
          c.direction = "ltr"; c.textAlign = "center";
          c.fillStyle = "#8a5a00"; c.font = "bold 22px Consolas, monospace"; c.fillText(fit(c, it.serial || "-", cols[2][2] - 16), cols[2].m, cy);
          c.fillStyle = "#222"; c.font = "22px 'Segoe UI', Arial"; c.fillText(fit(c, it.size || "-", cols[3][2] - 12), cols[3].m, cy);
          c.fillStyle = colors[st]; c.font = "bold 32px 'Segoe UI', Arial"; c.fillText(String(Number(it.qty) || 0), cols[4].m, cy);
          c.fillStyle = "#444"; c.font = "20px 'Segoe UI', Arial"; c.direction = "rtl";
          c.fillText(fit(c, it.loc || "", cols[5][2] - 12), cols[5].m, cy);
          c.direction = "ltr"; c.fillText(fit(c, it.price || "", cols[6][2] - 8), cols[6].m, cy);
        }
        c.fillStyle = "#999"; c.font = "20px 'Segoe UI', Arial"; c.textAlign = "center"; c.direction = "rtl";
        c.fillText("صفحة " + (p + 1) + " من " + npages, W / 2, H - 40);
        c.textAlign = "left"; c.direction = "ltr"; c.fillText("ABBADI", M, H - 40);
        pages.push({ w: W, h: H, bytes: dataToBytes(cv.toDataURL("image/jpeg", 0.85)) });
      }
      return pages;
    });
  }
  function dataToBytes(d) {
    var bin = atob(d.split(",")[1]), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  // يبني ملف PDF بسيط: كل صفحة صورة بحجم A4
  function makePdf(pages) {
    var parts = [], offs = [], pos = 0;
    function put(x) {
      if (typeof x === "string") { var b = new Uint8Array(x.length); for (var i = 0; i < x.length; i++) b[i] = x.charCodeAt(i) & 255; x = b; }
      parts.push(x); pos += x.length;
    }
    function obj(n, head, stream) {
      offs[n] = pos;
      put(n + " 0 obj\n" + head);
      if (stream) { put("\nstream\n"); put(stream); put("\nendstream"); }
      put("\nendobj\n");
    }
    put("%PDF-1.4\n");
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    var kids = pages.map(function (_, i) { return (5 + 3 * i) + " 0 R"; }).join(" ");
    obj(2, "<< /Type /Pages /Kids [" + kids + "] /Count " + pages.length + " >>");
    pages.forEach(function (pg, i) {
      var im = 3 + 3 * i, ct = 4 + 3 * i, pgn = 5 + 3 * i, content = "q 595 0 0 842 0 0 cm /Im0 Do Q";
      obj(im, "<< /Type /XObject /Subtype /Image /Width " + pg.w + " /Height " + pg.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + pg.bytes.length + " >>", pg.bytes);
      obj(ct, "<< /Length " + content.length + " >>", content);
      obj(pgn, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 " + im + " 0 R >> >> /Contents " + ct + " 0 R >>");
    });
    var count = 3 + 3 * pages.length, xpos = pos, xr = "xref\n0 " + count + "\n0000000000 65535 f \n";
    for (var n = 1; n < count; n++) xr += ("0000000000" + offs[n]).slice(-10) + " 00000 n \n";
    put(xr + "trailer\n<< /Size " + count + " /Root 1 0 R >>\nstartxref\n" + xpos + "\n%%EOF");
    return new Blob(parts, { type: "application/pdf" });
  }
  function buildPdfBlob() { return buildPages().then(makePdf); }
  function saveBlob(name, blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  var busy = false;
  function sharePdf(viaWhatsapp) {
    if (!items.length) { toast("ما في قطع بالجرد"); return; }
    if (busy) return;
    busy = true; toast("عم جهّز الملف...");
    buildPdfBlob().then(function (blob) {
      var name = "ABBADI-" + stamp() + ".pdf";
      var file = new File([blob], name, { type: "application/pdf" });
      if (viaWhatsapp && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: "جرد ABBADI" }).catch(function (e) { if (!e || e.name !== "AbortError") throw e; });
      }
      saveBlob(name, blob);
      if (viaWhatsapp) { window.open("https://wa.me/", "_blank"); toast("نزل الملف. أرفقه بمحادثة الواتس اللي انفتحت"); }
      else toast("تم حفظ الملف");
    }).catch(function () { toast("صار خطأ بتجهيز الملف"); }).then(function () { busy = false; });
  }
  $("side").addEventListener("click", function (e) {
    if (e.target.closest("#shareBtn")) sharePdf(true);
    else if (e.target.closest("#pdfBtn")) sharePdf(false);
  });

  load();
  $("sort").value = lsGet(KEY_SORT) || "name";
  if ($("sort").value === "") $("sort").value = "name";
  render(); checkBackup();
  $("q").focus();
})();
</script>
